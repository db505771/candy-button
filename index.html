  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
  overflow: hidden;
}

.liquid-glass-pure {
  --r: 28px;            /* corner radius: set to half the height for a pill */
  --a: 135deg;          /* light direction, follows your finger */
  --fill: 1;            /* how solid the color is: 1.3 deeper, 0.6 clearer glass */
  --glow: 1;            /* strength of the glow inside the edge */

  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: none;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  border-radius: var(--r);
  overflow: hidden;

  -webkit-mask-image: -webkit-radial-gradient(white, black);

  /* the glass: lighter at the top left, deeper at the bottom, still see-through */
  background: linear-gradient(165deg,
    rgba(255,110,130,calc(.22 * var(--fill))) 0%,
    rgba(200,40,65,calc(.42 * var(--fill))) 45%,
    rgba(120,14,34,calc(.58 * var(--fill))) 100%);

  backdrop-filter: blur(5px) saturate(150%);
  -webkit-backdrop-filter: blur(5px) saturate(150%);

  box-shadow:
    inset 0 0 0 .5px rgba(255,235,238,.2),
    inset 0 2px 3px -1px rgba(255,235,238,.42),
    inset 0 -7px 9px -6px rgba(70,0,18,.45),
    inset 0 0 10px 0 rgba(255,70,95,calc(.24 * var(--glow)));

  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

.liquid-glass-pure::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: inherit;
  pointer-events: none;
  box-shadow:
    inset 3px 3px 6px -3px rgba(255,190,120,.18),
    inset -3px -3px 6px -3px rgba(255,70,140,.2);
}

/* rim that sweeps toward your finger */
.liquid-glass-pure::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  border-radius: inherit;
  padding: 1.2px;
  pointer-events: none;
  background: linear-gradient(var(--a),
    rgba(255,235,238,1),
    rgba(255,120,135,.1) 26%,
    rgba(255,120,135,.1) 70%,
    rgba(255,200,206,.8));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);

  .liquid-glass-pure::after { display: none; }
}

  position: absolute;
  inset: 0;
  z-index: 1;
  border-radius: inherit;
  overflow: hidden;
  pointer-events: none;
}
.fx svg { display: block; width: 100%; height: 100%; }

/* press: squish, then spring back, and the details brighten */

.liquid-glass-pure.p { transform: scale(.965); }
.liquid-glass-pure:active .fx svg,
.liquid-glass-pure.p .fx svg { filter: brightness(1.25); }
</style>

    svg.innerHTML = '<filter id="lg" filterUnits="userSpaceOnUse" x="0" y="0" width="' + w + '" height="' + h + '" color-interpolation-filters="sRGB">' +

      'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + f(x + w - r) + ',' + f(y + h) + 'H' + f(x + r) + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + f(x) + ',' + f(y + h - r) +
      'V' + f(y + r) + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + f(x + r) + ',' + f(y) + 'Z';

      '<linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".17"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>';

      return '<path d="M' + f(t0) + ',0L' + f(t1) + ',0L' + f(b1) + ',' + H + 'L' + f(b0) + ',' + H + 'Z" fill="url(#' + id + ')"/>';

    defs += '<linearGradient id="c1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="' + f(W * .5) + '" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
            '<linearGradient id="c2" gradientUnits="userSpaceOnUse" x1="' + W + '" y1="0" x2="' + f(W * .55) + '" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>';
    return { defs: defs, body: '<g clip-path="url(#sh)"><rect width="' + W + '" height="' + f(H * .6) + '" fill="url(#gt)"/>' + body + '</g>' +
      '<path d="M' + f(ax) + ',' + f(ay) + 'A' + f(r1) + ' ' + f(r1) + ' 0 0 1 ' + f(rad) + ',1.6H' + f(W * .5) + '" fill="none" stroke="url(#c1)" stroke-width="1.5" stroke-linecap="round"/>' +
      '<path d="M' + f(bx) + ',' + f(by) + 'A' + f(r1) + ' ' + f(r1) + ' 0 0 1 ' + f(W - rad) + ',' + f(H - 1.6) + 'H' + f(W * .55) + '" fill="none" stroke="url(#c2)" stroke-width="1.2" stroke-linecap="round"/>' };
  }

  function gloss() {
    var W = b.offsetWidth, H = b.offsetHeight; if (!fx || W < 60 || H < 20) return;
    var rad = Math.min(parseFloat(getComputedStyle(b).borderTopLeftRadius) || 28, H / 2, W / 2);
    var R = rng(seed), r = function (lo, hi) { return lo + (hi - lo) * R(); }, d = '', pre = '', post = '', i, k;

         '<pattern id="st" width="' + f(sp) + '" height="' + H + '" patternUnits="userSpaceOnUse" patternTransform="translate(' + f(ox) + ' 0) skewX(-30)"><rect x="' + f((sp - bw) / 2) + '" width="' + f(bw) + '" height="' + H + '" fill="url(#sg)"/></pattern>';
